name: Deploy secured static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check app.js
          node --check sw.js
          node --check scripts/validate-release.mjs
          node --check scripts/render-assetlinks.mjs
          node --check tests/game-logic.test.mjs
      - name: Run security and game tests
        run: |
          set -euo pipefail
          node scripts/validate-release.mjs
          node --test tests/game-logic.test.mjs
      - name: Prepare deployment allowlist
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          install -m 0644 .nojekyll index.html privacy.html bootstrap.js app.js style.css manifest.json sw.js version.json _site/
          install -m 0644 icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png _site/icons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site"
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
