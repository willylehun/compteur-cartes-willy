name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "security-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  audit:
    name: Static audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Validate syntax, security and game logic
        run: |
          set -euo pipefail
          node --check bootstrap.js
          node --check app.js
          node --check sw.js
          node --check scripts/validate-release.mjs
          node --check tests/game-logic.test.mjs
          node scripts/validate-release.mjs
          node --test tests/game-logic.test.mjs
